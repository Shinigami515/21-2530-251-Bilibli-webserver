<!--Activity Questions And Answers
Question 1: What happened when you refreshed the browser?
Answer: After editing <h1> text in index.html and saving, refreshing the 
browser showed the updated heading right away.

Question 2: What happens when you click the About link?
Answer: The browser sends a GET request for about.html. The server finds
about.html in the web directory and returns with a status.

Question 3: What happens when you click the Home link?
Answer: The browser sends a GET request for index.html. The server finds
index.html, returning the broswer to the home page.

Question 4: What does the 200 status code indicate?
Answer: 200 means the request succeeded and the servers found the 
requested file and sent it back without errors.

Question 5: What HTTP method appears in the server log?
Answer: GET, since the browser is only requesting pages to view.

Question 6: What files is requested when you open the root URL?
Answer: index.html. When a URL has no specific filename, Pythons http.server
automatically looks for index.html as the default file in that directory
